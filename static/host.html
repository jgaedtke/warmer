<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warmer — observer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/flame.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- One-way games created before two-way matches existed: the word-keeper's private link. -->
<div class="wrap wide">
  <header class="top"><span data-brand></span><span class="top-meta"><span class="pill" id="status">playing</span><span class="pill live" id="seeker">seeker offline</span></span></header>

  <div id="loading" class="empty">Loading…</div>
  <div id="denied" class="hidden"><h1>Not your word.</h1><p class="lede">This observer link is invalid or incomplete. <a href="/">Start your own →</a></p></div>

  <main id="game" class="hidden"><div id="observer"></div></main>
</div>

<script src="/static/common.js"></script>
<script src="/static/observer.js"></script>
<script>
const id = location.pathname.split("/").pop();
const q = `k=${encodeURIComponent(new URLSearchParams(location.search).get("k") || "")}`;
let S;
const nameOf = (s) => (s === "host" ? "You" : "Seeker");
const panel = ObserverPanel($("#observer"), {});
const playUrl = `${location.origin}/g/${id}`;
panel.el("aside").innerHTML = `<div class="linkbox" style="min-width:min(100%,360px)"><code>${esc(playUrl)}</code><button class="btn sm" id="copy-play">Copy invite</button></div>`;
panel.el("side").innerHTML = `<div class="card"><h2>Send a nudge</h2><div class="msgs" id="msgs"></div>
  <form class="row" id="msg-form" autocomplete="off"><input class="input grow" id="msg" maxlength="280" placeholder="Think smaller… / Remember the boat?"><button class="btn">Send</button></form>
  <div class="status-line err" id="msg-err"></div></div>`;
$("#copy-play").onclick = (e) => copy(playUrl, e.currentTarget);

function statusPill(st) {
  const el = $("#status");
  el.className = `pill ${st}`;
  el.textContent = st === "solved" ? "solved" : st === "revealed" ? "gave up" : "in progress";
}

async function load() {
  try { S = await api(`/api/games/${id}/host?${q}`); }
  catch { $("#loading").classList.add("hidden"); $("#denied").classList.remove("hidden"); return false; }
  $("#loading").classList.add("hidden"); $("#game").classList.remove("hidden");
  document.title = `Warmer — watching “${S.secret}”`;
  panel.load(S); statusPill(S.status);
  renderMessages($("#msgs"), S.messages, "host", nameOf);
  presence(S.presence);
  if (S.guesses.length) setGlow(Math.max(...S.guesses.map((g) => proximity(g, S.reference))));
  return true;
}

function presence(p) {
  const el = $("#seeker"), n = p.player || 0;
  el.classList.toggle("on", n > 0);
  el.textContent = n ? (n > 1 ? `${n} seekers online` : "seeker online") : "seeker offline";
}

$("#msg-form").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("#msg").value.trim(); if (!t) return;
  $("#msg-err").textContent = "";
  try { await api(`/api/games/${id}/host/message?${q}`, { method: "POST", body: { text: t } }); $("#msg").value = ""; }
  catch (err) { $("#msg-err").textContent = err.message; }
};

load().then((ok) => {
  if (!ok) return;
  live(`/api/games/${id}/host/stream?${q}`, {
    guess: ({ guess: g }) => {
      if (!panel.add(g)) return;
      setGlow(Math.max(...panel.state.guesses.map((x) => proximity(x, S.reference))));
      if (g.rank === 0) toast(`They found “${S.secret}” in ${panel.state.guesses.length} guesses!`, "Solved");
      else if (g.rank && g.rank <= 10) toast(g.word ? `“${g.word}” is #${g.rank} — they're very close.` : `A hidden guess is #${g.rank} — they're very close.`, "Burning");
    },
    "guess-update": ({ guess }) => panel.update(guess),
    message: (m) => {
      S.messages.push(m); renderMessages($("#msgs"), S.messages, "host", nameOf);
      if (m.sender === "player") toast(m.text, "Seeker says");
    },
    presence,
    finished: ({ state }) => {
      panel.finish(state); statusPill(state.status);
      if (state.status === "revealed") toast("They gave up and revealed the word.", "Game over");
    },
  }, async () => { S = await api(`/api/games/${id}/host?${q}`); panel.load(S); statusPill(S.status); renderMessages($("#msgs"), S.messages, "host", nameOf); });
});
</script>
</body>
</html>
