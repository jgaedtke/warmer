<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warmer — choose a word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/flame.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Serves both "/" (start a game) and "/j/<id>" (join one by choosing a word in return). -->
<div class="wrap">
  <header class="top"><span data-brand></span></header>

  <div id="loading" class="empty hidden">Loading…</div>
  <div id="unavailable" class="hidden"><h1 id="un-title"></h1><p class="lede" id="un-text"></p></div>

  <section id="compose">
    <h1 id="heading">Choose a word.</h1>
    <p class="lede hidden" id="join-lede"></p>
    <div class="theme-banner hidden" id="their-theme"><small>Their clue for you</small><span></span></div>

    <form id="form" class="card" autocomplete="off" style="margin-top:32px">
      <label class="field">
        <span id="secret-label">Secret word</span>
        <div class="row">
          <input class="input big grow" id="secret" placeholder="e.g. lighthouse" maxlength="40" spellcheck="false" autocapitalize="off" required>
          <button type="button" class="btn" id="random" title="Pick a random word">Surprise me</button>
        </div>
        <div class="status-line" id="check-status"></div>
      </label>

      <div id="preview" class="hidden" style="margin:-6px 0 26px">
        <h2>Its nearest neighbours</h2>
        <div class="chips" id="neighbours"></div>
        <p class="ref" id="preview-ref"></p>
      </div>

      <label class="field">
        <span>Your name <small>— shown to your friend</small></span>
        <input class="input" id="name" maxlength="40" placeholder="Your name">
      </label>
      <label class="field">
        <span>Theme or opening clue <small>— optional, visible from the start</small></span>
        <input class="input" id="theme" maxlength="200" placeholder="Something from our summer in Lisbon">
      </label>
      <label class="field">
        <span>A note revealed when they find it <small>— optional</small></span>
        <textarea class="input" id="note" maxlength="600" placeholder="Why this word matters to you…"></textarea>
      </label>

      <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:16px">
        <label class="toggle"><input type="checkbox" id="allow_hints" checked><i></i>Allow hints</label>
        <button class="btn primary" id="submit" type="submit" disabled>Create game →</button>
      </div>
      <div class="status-line err" id="submit-err"></div>
    </form>
  </section>

  <section id="past" class="hidden section-gap">
    <h2>Your games</h2>
    <div class="card" style="padding:6px 18px"><ul class="feed" id="past-list"></ul></div>
  </section>
</div>

<script src="/static/common.js"></script>
<script>
const joinId = location.pathname.startsWith("/j/") ? location.pathname.split("/").pop() : null;
const secret = $("#secret"), submitBtn = $("#submit"), st = $("#check-status");
let checkSeq = 0, timer, okWord = null;

async function check() {
  const w = secret.value.trim();
  okWord = null; submitBtn.disabled = true;
  if (!w) { st.textContent = ""; $("#preview").classList.add("hidden"); return; }
  const seq = ++checkSeq;
  try {
    const r = await api(`/api/check?word=${encodeURIComponent(w)}`);
    if (seq !== checkSeq) return;
    if (!r.ok) {
      st.className = "status-line err"; st.textContent = r.reason; $("#preview").classList.add("hidden"); return;
    }
    okWord = r.word; submitBtn.disabled = false;
    st.className = "status-line ok"; st.textContent = `“${r.word}” works — a ${r.difficulty} hunt.`;
    $("#neighbours").innerHTML = r.neighbours.map(([x, s]) => `<span class="chip"><b>${esc(x)}</b>${s}</span>`).join("");
    $("#preview-ref").innerHTML = `Nearest word scores <b>${r.reference.top1}</b> · 10th <b>${r.reference.top10}</b> · 1000th <b>${r.reference.top1000}</b>`;
    $("#preview").classList.remove("hidden");
  } catch (e) { st.className = "status-line err"; st.textContent = e.message; }
}
secret.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(check, 250); });
$("#random").onclick = async () => { secret.value = (await api("/api/random")).word; check(); };

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  if (!okWord) return;
  submitBtn.disabled = true;
  const body = { secret: okWord, name: $("#name").value, theme: $("#theme").value, note: $("#note").value, allow_hints: $("#allow_hints").checked };
  try {
    const r = await api(joinId ? `/api/matches/${joinId}/join` : "/api/matches", { method: "POST", body });
    store.set("warmer:name", $("#name").value);
    store.set(`warmer:match:${r.id}`, r.token);
    saveGame({ id: r.id, word: okWord, url: r.url, created: Date.now() });
    location.href = r.url;
  } catch (err) { $("#submit-err").textContent = err.message; submitBtn.disabled = false; }
};

function loadGames() { try { return JSON.parse(store.get("warmer:games", "[]")); } catch { return []; } }
function saveGame(g) { store.set("warmer:games", JSON.stringify([g, ...loadGames().filter((x) => x.id !== g.id)].slice(0, 20))); }

function renderPast() {
  const games = loadGames();
  if (!games.length) return;
  $("#past").classList.remove("hidden");
  $("#past-list").innerHTML = games.map((g) => `<li><time>${new Date(g.created).toLocaleDateString([], { month: "short", day: "numeric" })}</time><span class="fw">${esc(g.word)}</span><a class="btn sm" href="${esc(g.url || g.host_url)}">Open →</a></li>`).join("");
}

function unavailable(title, text) {
  $("#loading").classList.add("hidden"); $("#compose").classList.add("hidden");
  $("#un-title").textContent = title; $("#un-text").innerHTML = text;
  $("#unavailable").classList.remove("hidden");
}

async function initJoin() {
  const token = store.get(`warmer:match:${joinId}`);
  if (token) { location.replace(`/m/${joinId}?k=${encodeURIComponent(token)}`); return; }
  $("#compose").classList.add("hidden"); $("#loading").classList.remove("hidden");
  let inv;
  try { inv = await api(`/api/matches/${joinId}/invite`); }
  catch { unavailable("No game here.", `This link may be mistyped. <a href="/">Start your own →</a>`); return; }
  if (inv.joined) {
    unavailable("This game is already underway.", `Both players have chosen their words. If you're one of them, open the personal link you were given. Or <a href="/">start a new game →</a>`);
    return;
  }
  const who = inv.name || "Your friend";
  document.title = `Warmer — ${who} chose a word for you`;
  $("#heading").innerHTML = `${esc(who)} chose a word <em>for you</em>.`;
  $("#join-lede").textContent = `Choose one for ${who} in return — then you both start guessing.`;
  $("#join-lede").classList.remove("hidden");
  if (inv.theme) { $("#their-theme").classList.remove("hidden"); $("#their-theme span").textContent = inv.theme; }
  $("#secret-label").textContent = `Your word for ${who}`;
  submitBtn.textContent = "Start guessing →";
  $("#loading").classList.add("hidden"); $("#compose").classList.remove("hidden");
  $("#name").value = store.get("warmer:name", "");
}

if (joinId) initJoin();
else {
  renderPast();
  const saved = store.get("warmer:name");
  if (saved) $("#name").value = saved;
  else api("/api/config").then((c) => { if (!$("#name").value) $("#name").value = c.default_name; }).catch(() => {});
}
</script>
</body>
</html>
