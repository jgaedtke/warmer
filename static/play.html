<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warmer — find the word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/flame.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- One-way games created before two-way matches existed: the seeker's open link. -->
<div class="wrap">
  <header class="top"><span data-brand></span><span class="top-meta"><span class="pill live" id="watching">offline</span></span></header>

  <div id="loading" class="empty">Loading…</div>
  <div id="missing" class="hidden"><h1>No game here.</h1><p class="lede">This link may be mistyped. <a href="/">Start your own →</a></p></div>

  <main id="game" class="hidden">
    <h1 id="title"></h1>
    <div id="seeker"></div>
    <section class="card section-gap" id="chat">
      <h2>Messages with <span class="host-name">the word-keeper</span></h2>
      <div class="msgs" id="msgs"></div>
      <form class="row" id="msg-form" autocomplete="off"><input class="input grow" id="msg" maxlength="280" placeholder="Say something…"><button class="btn">Send</button></form>
    </section>
  </main>
</div>

<script src="/static/common.js"></script>
<script src="/static/seeker.js"></script>
<script>
const id = location.pathname.split("/").pop();
let S;
const keeperName = () => S?.keeper_name || "";
const nameOf = (s) => (s === "host" ? keeperName() || "Word-keeper" : "Seeker");
const panel = SeekerPanel($("#seeker"), {
  urls: { guess: `/api/games/${id}/guess`, hint: `/api/games/${id}/hint`, giveUp: `/api/games/${id}/give-up`, visibility: `/api/games/${id}/visibility` },
  keeperName,
  finishCta: `<a class="btn primary" href="/">Choose a word for someone →</a>`,
  onHeat: setGlow,
});

async function load() {
  try { S = await api(`/api/games/${id}`); }
  catch { $("#loading").classList.add("hidden"); $("#missing").classList.remove("hidden"); return false; }
  $("#loading").classList.add("hidden"); $("#game").classList.remove("hidden");
  $("#title").innerHTML = `${esc(S.keeper_name || "Someone")} chose a word <em>for you</em>.`;
  document.querySelectorAll(".host-name").forEach((el) => (el.textContent = S.keeper_name || "the word-keeper"));
  panel.load(S);
  renderMessages($("#msgs"), S.messages, "player", nameOf);
  presence(S.presence);
  return true;
}

function presence(p) {
  const el = $("#watching"), on = (p.host || 0) > 0;
  el.classList.toggle("on", on);
  el.textContent = on ? `${keeperName() || "Word-keeper"} is watching` : "not watching";
}

$("#msg-form").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("#msg").value.trim(); if (!t) return;
  $("#msg").value = "";
  try { await api(`/api/games/${id}/message`, { method: "POST", body: { text: t } }); } catch (err) { toast(err.message); }
};

load().then((ok) => {
  if (!ok) return;
  live(`/api/games/${id}/stream`, {
    guess: ({ guess }) => { if (!panel.has(guess.n)) panel.add(guess); },
    "guess-update": ({ guess }) => panel.update(guess),
    message: (m) => {
      S.messages.push(m); renderMessages($("#msgs"), S.messages, "player", nameOf);
      if (m.sender === "host") toast(m.text, `${keeperName() || "Word-keeper"} says`);
    },
    presence,
    finished: ({ state }) => { if (panel.state.status === "playing") panel.finish(state, true); },
  }, async () => { S = await api(`/api/games/${id}`); panel.load(S); renderMessages($("#msgs"), S.messages, "player", nameOf); });
});
</script>
</body>
</html>
